<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:site_name" content="Toro Roso Studio" />
    <meta property="og:title" content="Toro Roso Studio · Maquillaje profesional" />
    <meta
      property="og:description"
      content="Elegancia para cada ocasión. Novias, quinceañeras, social, artístico y graduaciones. Servicio a domicilio en Envigado, Antioquia."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/brand/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo de Toro Roso Studio en rosa metálico sobre fondo negro" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Toro Roso Studio · Maquillaje profesional" />
    <meta name="twitter:description" content="Elegancia para cada ocasión. Servicio a domicilio en Envigado, Antioquia." />
    <meta name="twitter:image" content="__SITE_URL__/brand/og-image.jpg" />

    <link rel="preconnect" href="https://images.pexels.com" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="/brand/logo-640.webp 640w, /brand/logo-1000.webp 1000w, /brand/logo-1600.webp 1600w"
      imagesizes="(min-width: 565px) 440px, 78vw"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BeautySalon",
        "name": "Toro Roso Studio",
        "slogan": "Elegancia para cada ocasión",
        "description": "Maquillaje profesional a domicilio para novias, quinceañeras, graduaciones, eventos sociales y maquillaje artístico.",
        "url": "__SITE_URL__/",
        "image": "__SITE_URL__/brand/og-image.jpg",
        "logo": "__SITE_URL__/brand/logo-640.png",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Envigado",
          "addressRegion": "Antioquia",
          "addressCountry": "CO"
        },
        "areaServed": { "@type": "City", "name": "Envigado" },
        "telephone": "+57 322 493 5632",
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
            "opens": "08:00",
            "closes": "20:00"
          }
        ],
        "sameAs": ["https://www.instagram.com/tororosostudio/"],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Servicios de maquillaje",
          "itemListElement": [
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Maquillaje para novias" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Maquillaje para quinceañeras" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Maquillaje social" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Maquillaje artístico" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Maquillaje para graduaciones" } }
          ]
        }
      }
    </script>

    <style>
      html,
      body {
        background: #050505;
        color: #f2e9ee;
      }
    </style>
  </head>

        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
